location ^~ /_protected-videos/ {
    internal;
    alias /data/remove-watermark/ready/;
    default_type video/mp4;
    sendfile on;
    tcp_nopush on;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
